name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
  encrypted:
    # sqlcipher3-binary ships Linux x86_64 wheels only; this runs the real SQLCipher tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y xvfb xprintidle
      - run: python -m pip install -e ".[dev,encrypted]"
      - run: python -c "from sqlcipher3 import dbapi2"
      # Under a virtual X server so the real xprintidle test runs too.
      - run: xvfb-run -a python -m pytest
  encrypted-macos:
    # Checks start.md's macOS recipe (brew sqlcipher + sqlcipher3 from source).
    # Non-blocking: it tests a documented workaround, not FocusGuard's own code.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: brew install sqlcipher
      - run: |
          P="$(brew --prefix sqlcipher)"
          C_INCLUDE_PATH="$P/include:$P/include/sqlcipher" LIBRARY_PATH="$P/lib" \
            python -m pip install sqlcipher3
      - run: python -m pip install -e ".[dev]"
      - run: python -c "from sqlcipher3 import dbapi2"
      - run: python -m pytest tests/test_storage.py -v
